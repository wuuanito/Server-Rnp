version: '3.8'

services:
  # Servicio de autenticación
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=production
      - PORT=4001
      - DB_HOST=mysql-auth
      - DB_PORT=3306
      - DB_USER=naturepharma
      - DB_PASSWORD=Root123!
      - AUTH_DB_NAME=auth_service_db
      - JWT_SECRET=your_jwt_secret_key_should_be_long_and_secure_change_this_in_production
      - JWT_EXPIRES_IN=24h
    depends_on:
      - mysql-auth
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4001/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend Cremer
  cremer-backend:
    build:
      context: ./Cremer-Backend
      dockerfile: Dockerfile
    container_name: cremer-backend
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DB_HOST=mysql-cremer
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=cremer
    depends_on:
      - mysql-cremer
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend Tecnomaco
  tecnomaco-backend:
    build:
      context: ./Tecnomaco-Backend
      dockerfile: Dockerfile
    container_name: tecnomaco-backend
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
      - DB_HOST=mysql-tecnomaco
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=tecnomaco
    depends_on:
      - mysql-tecnomaco
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3005/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Servidor RPS
  servidor-rps:
    build:
      context: ./Servidor_rps
      dockerfile: Dockerfile
    container_name: servidor-rps
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      # Configuración SQL Server externa (mantener IP original)
      - SQL_SERVER=192.168.11.2
      - SQL_USER=rpsuser
      - SQL_PASSWORD=rpsnext
      - SQL_DATABASE=RpsNext
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Base de datos MySQL para Auth Service
  mysql-auth:
    image: mysql:8.0
    container_name: mysql-auth
    environment:
      - MYSQL_ROOT_PASSWORD=Root123!
      - MYSQL_DATABASE=auth_service_db
      - MYSQL_USER=naturepharma
      - MYSQL_PASSWORD=Root123!
    ports:
      - "3307:3306"
    volumes:
      - mysql_auth_data:/var/lib/mysql
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Base de datos MySQL para Cremer
  mysql-cremer:
    image: mysql:8.0
    container_name: mysql-cremer
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=cremer
    ports:
      - "3308:3306"
    volumes:
      - mysql_cremer_data:/var/lib/mysql
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Base de datos MySQL para Tecnomaco
  mysql-tecnomaco:
    image: mysql:8.0
    container_name: mysql-tecnomaco
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=tecnomaco
    ports:
      - "3309:3306"
    volumes:
      - mysql_tecnomaco_data:/var/lib/mysql
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx como reverse proxy (opcional)
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - auth-service
      - cremer-backend
      - tecnomaco-backend
      - servidor-rps
    networks:
      - app-network
    restart: unless-stopped

volumes:
  mysql_auth_data:
    driver: local
  mysql_cremer_data:
    driver: local
  mysql_tecnomaco_data:
    driver: local

networks:
  app-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16